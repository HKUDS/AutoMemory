[project]
name = "ask-ref"
version = "0.1.0"
description = "Reference technique catalog for Auto_Memory harness"
requires-python = ">=3.9"
dependencies = ["typer>=0.12.0,<1.0.0"]

[project.scripts]
ask_ref = "ask_ref.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ask_ref"]
